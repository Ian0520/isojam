[project]
name = "isojam-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "starlette>=1.6,<2.0",
    "uvicorn",
    "python-multipart",
    "sqlalchemy>=2.0,<3.0",
    "alembic",
    "pwdlib[argon2]",
    "email-validator",
    "pyjwt",
    "numpy>=1.23",
    "soundfile>=0.12",
]

[project.optional-dependencies]
inference = [
    "bs-roformer-infer @ git+https://github.com/openmirlab/bs-roformer-infer.git@de35ada5817b878da0194ee2860253dda3a9c2b2",
]
dev = [
    "pytest",
    "httpx2",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app", "app.*"]
exclude = ["migrations", "migrations.*", "tests", "tests.*"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
